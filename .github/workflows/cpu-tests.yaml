name: SheepRL CPU tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  cpu-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The venv links to the runner's Python, so the key holds its full patch version
      - name: Restore venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: env
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'setup.py') }}

      - name: Create venv
        if: ${{ steps.venv-cache.outputs.cache-hit != 'true' }}
        run: |
          python -m venv env

      - name: Install packages Windows
        if: ${{ matrix.os == 'windows-latest' && steps.venv-cache.outputs.cache-hit != 'true' }}
        shell: powershell
        run: |
          choco upgrade swig -y
          env\\Scripts\\Activate.ps1
          python -m pip install -e .[atari,box2d,test,dev]

      # The default Linux wheel of torch pulls in the CUDA libraries, which the CPU tests never use.
      # The pip bundled with Python 3.10 (23.0.1) cannot install torch's dependencies from the PyTorch index
      - name: Install packages Linux
        if: ${{ matrix.os == 'ubuntu-latest' && steps.venv-cache.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get install --no-install-recommends -y --only-upgrade swig
          source env/bin/activate
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .[atari,box2d,test,dev]

      - name: Run tests Windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: powershell
        run: |
          env\\Scripts\\Activate.ps1
          python tests/run_tests.py

      - name: Run tests Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          source env/bin/activate
          python tests/run_tests.py
