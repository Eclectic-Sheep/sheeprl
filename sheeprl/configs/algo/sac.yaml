defaults:
  - default
  - /optim@actor.optimizer: adam
  - /optim@critic.optimizer: adam
  - /optim@alpha.optimizer: adam
  - _self_

name: sac
tau: 0.005
gamma: 0.99
hidden_size: 256

# Training recipe
replay_ratio: 1.0
learning_starts: 100
per_rank_pretrain_steps: 0

# Compile the losses with `torch.compile`: faster gradient steps, after a compilation at the start (a minute or so the
# first time, then mostly reused from the cache of PyTorch).
# `mode` is the one of `torch.compile`: `reduce-overhead` also replays the kernels of every loss with CUDA graphs
# (with `fabric.precision` `32-true` or `bf16-mixed`; with another precision the default mode is used)
compile:
  enabled: False
  mode: reduce-overhead

# Model related parameters
# Actor
actor:
  hidden_size: ${algo.hidden_size}
  optimizer:
    lr: 3e-4
    eps: 1e-4
    # One kernel for the whole update of the weights
    fused: True

# Critic
critic:
  n: 2
  hidden_size: ${algo.hidden_size}
  target_network_frequency: 1
  optimizer:
    lr: 3e-4
    eps: 1e-4
    # One kernel for the whole update of the weights
    fused: True

# Entropy coefficient
alpha:
  alpha: 1.0
  optimizer:
    lr: 3e-4
    eps: 1e-4
    # One kernel for the whole update of the weights
    fused: True
