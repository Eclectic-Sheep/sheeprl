defaults:
  - default
  - /optim@world_model.optimizer: adam
  - /optim@actor.optimizer: adam
  - /optim@critic.optimizer: adam
  - _self_

name: dreamer_v2
gamma: 0.99
lmbda: 0.95
horizon: 15
# The bounded dimensions of continuous actions exposed as [-1, 1] (the range of the actor), rescaled to the bounds of
# the environment (`sheeprl.envs.wrappers.NormalizeAction`)
normalize_actions: True

# Training recipe
replay_ratio: 0.2
learning_starts: 1000
per_rank_pretrain_steps: 100
per_rank_sequence_length: ???


# Inputs: the images resized and scaled to [-0.5, 0.5] into the CNN of the world model, the vectors into its MLP.
# Outputs: the same keys reconstructed by the observation model, scored with a unit-variance Normal
inputs:
  image:
    keys: []
    transforms:
      - {_target_: sheeprl.transforms.Image, size: "${env.screen_size}", grayscale: "${env.grayscale}"}
      - {_target_: sheeprl.transforms.Scale, divisor: 255, shift: 0.5}
    net:
      _target_: sheeprl.algos.dreamer_v2.agent.CNNEncoder
      channels_multiplier: 48
      activation: ${algo.cnn_act}
      layer_norm: ${algo.layer_norm}
  vector:
    keys: []
    transforms: []
    net:
      _target_: sheeprl.algos.dreamer_v2.agent.MLPEncoder
      mlp_layers: ${algo.mlp_layers}
      dense_units: ${algo.dense_units}
      activation: ${algo.dense_act}
      layer_norm: ${algo.layer_norm}
outputs:
  image:
    keys: ${algo.inputs.image.keys}
    net:
      _target_: sheeprl.algos.dreamer_v2.agent.CNNDecoder
      channels_multiplier: ${algo.inputs.image.net.channels_multiplier}
      activation: ${algo.cnn_act}
      layer_norm: ${algo.layer_norm}
    likelihood: {_target_: sheeprl.utils.distribution.UnitNormal, _partial_: true}
  vector:
    keys: ${algo.inputs.vector.keys}
    net:
      _target_: sheeprl.algos.dreamer_v2.agent.MLPDecoder
      mlp_layers: ${algo.mlp_layers}
      dense_units: ${algo.dense_units}
      activation: ${algo.dense_act}
      layer_norm: ${algo.layer_norm}
    likelihood: {_target_: sheeprl.utils.distribution.UnitNormal, _partial_: true}

# Model related parameters
layer_norm: False
dense_units: 400
mlp_layers: 4
dense_act: torch.nn.ELU
cnn_act: torch.nn.ELU

# World model
world_model:
  discrete_size: 32
  stochastic_size: 32
  kl_balancing_alpha: 0.8
  kl_free_nats: 1.0
  kl_free_avg: True
  kl_regularizer: 1.0
  discount_scale_factor: 1.0
  use_continues: False
  clip_gradients: 100.0

  # Recurrent model: the layer before the GRU has the size of the hidden layers of the prior and of the posterior (the
  # `hidden` of the RSSM of the official implementation), and is normalized as them
  recurrent_model:
    recurrent_state_size: 600
    layer_norm: ${algo.layer_norm}
    dense_units: ${algo.world_model.transition_model.hidden_size}

  # Prior
  transition_model:
    hidden_size: 600
    dense_act: ${algo.dense_act}
    layer_norm: ${algo.layer_norm}

  # Posterior
  representation_model:
    hidden_size: 600
    dense_act: ${algo.dense_act}
    layer_norm: ${algo.layer_norm}

  # Reward
  reward_model:
    dense_act: ${algo.dense_act}
    mlp_layers: ${algo.mlp_layers}
    layer_norm: ${algo.layer_norm}
    dense_units: ${algo.dense_units}

  # Discount model
  discount_model:
    learnable: True
    dense_act: ${algo.dense_act}
    mlp_layers: ${algo.mlp_layers}
    layer_norm: ${algo.layer_norm}
    dense_units: ${algo.dense_units}

  # World model optimizer. The weight decay is the one of the official implementation: before every step the weights
  # are multiplied by `1 - weight_decay` (`sheeprl.algos.dreamer_v2.utils.build_optimizer`)
  optimizer:
    lr: 3e-4
    eps: 1e-5
    weight_decay: 1e-6

# Actor
actor:
  cls: sheeprl.algos.dreamer_v2.agent.Actor
  ent_coef: 1e-4
  min_std: 0.1
  init_std: 0.0
  # The weight of the REINFORCE gradients in the objective, the rest being the dynamics backpropagation. null: the
  # dynamics for continuous actions, REINFORCE for discrete ones (`actor_grad: auto` of DreamerV2)
  objective_mix: null
  dense_act: ${algo.dense_act}
  mlp_layers: ${algo.mlp_layers}
  layer_norm: ${algo.layer_norm}
  dense_units: ${algo.dense_units}
  clip_gradients: 100.0

  # Actor optimizer
  optimizer:
    lr: 8e-5
    eps: 1e-5
    weight_decay: 1e-6

# Critic
critic:
  dense_act: ${algo.dense_act}
  mlp_layers: ${algo.mlp_layers}
  layer_norm: ${algo.layer_norm}
  dense_units: ${algo.dense_units}
  per_rank_target_network_update_freq: 100
  clip_gradients: 100.0

  # Critic optimizer
  optimizer:
    lr: 8e-5
    eps: 1e-5
    weight_decay: 1e-6
