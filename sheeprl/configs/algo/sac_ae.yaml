defaults:
  - sac
  - /optim@encoder.optimizer: adam
  - /optim@decoder.optimizer: adam
  - _self_

name: sac_ae

# Training recipe
replay_ratio: 1.0
learning_starts: 1000
# The official implementation does `init_steps` (1000) gradient steps at its first training
per_rank_pretrain_steps: 1000

# Model related parameters
# The convolutions have 32 * `cnn_channels_multiplier` channels (32 in the official implementation)
cnn_channels_multiplier: 1
dense_units: 64
mlp_layers: 2
dense_act: torch.nn.ReLU
layer_norm: False

# Inputs: the images resized and scaled to [0, 1] into the CNN of SAC-AE, the vectors into an MLP; outputs: the same
# keys reconstructed by the decoder (scored with the mean squared error by SAC-AE: no likelihood)
inputs:
  image:
    keys: []
    transforms:
      - {_target_: sheeprl.transforms.Image, size: "${env.screen_size}", grayscale: "${env.grayscale}"}
      - {_target_: sheeprl.transforms.Scale, divisor: 255, shift: 0}
    net:
      _target_: sheeprl.algos.sac_ae.agent.CNNEncoder
      features_dim: ${algo.encoder.features_dim}
      channels_multiplier: ${algo.encoder.cnn_channels_multiplier}
  vector:
    keys: []
    transforms: []
    net:
      _target_: sheeprl.algos.sac_ae.agent.MLPEncoder
      features_dim: ${algo.encoder.features_dim}
      dense_units: ${algo.encoder.dense_units}
      mlp_layers: ${algo.encoder.mlp_layers}
      dense_act: ${algo.encoder.dense_act}
      layer_norm: ${algo.encoder.layer_norm}
outputs:
  image:
    keys: ${algo.inputs.image.keys}
    net:
      _target_: sheeprl.algos.sac_ae.agent.CNNDecoder
      channels_multiplier: ${algo.decoder.cnn_channels_multiplier}
  vector:
    keys: ${algo.inputs.vector.keys}
    net:
      _target_: sheeprl.algos.sac_ae.agent.MLPDecoder
      dense_units: ${algo.decoder.dense_units}
      mlp_layers: ${algo.decoder.mlp_layers}
      dense_act: ${algo.decoder.dense_act}
      layer_norm: ${algo.decoder.layer_norm}

# Encoder
encoder:
  tau: 0.05
  features_dim: 50
  cnn_channels_multiplier: ${algo.cnn_channels_multiplier}
  dense_units: ${algo.dense_units}
  mlp_layers: ${algo.mlp_layers}
  dense_act: ${algo.dense_act}
  layer_norm: ${algo.layer_norm}
  optimizer:
    lr: 1e-3
    eps: 1e-08

# Decoder
decoder:
  l2_lambda: 1e-6
  per_rank_update_freq: 1
  cnn_channels_multiplier: ${algo.cnn_channels_multiplier}
  dense_units: ${algo.dense_units}
  mlp_layers: ${algo.mlp_layers}
  dense_act: ${algo.dense_act}
  layer_norm: ${algo.layer_norm}
  optimizer:
    lr: 1e-3
    weight_decay: 1e-7
    eps: 1e-08

# Override from `sac` config
tau: 0.01
hidden_size: 1024
actor:
  per_rank_update_freq: 2
  optimizer:
    lr: 1e-3
    eps: 1e-08
critic:
  per_rank_target_network_update_freq: 2
  optimizer:
    lr: 1e-3
    eps: 1e-08
alpha:
  alpha: 0.1
  optimizer:
    lr: 1e-4
    betas: [0.5, 0.999]
    eps: 1e-08
