defaults:
  - default
  - /optim@world_model.optimizer: adam
  - /optim@actor.optimizer: adam
  - /optim@critic.optimizer: adam
  - _self_

gamma: 0.99
lmbda: 0.95
horizon: 15
name: dreamer_v1
# The bounded dimensions of continuous actions exposed as [-1, 1] (the range of the actor), rescaled to the bounds of
# the environment (`sheeprl.envs.wrappers.NormalizeAction`)
normalize_actions: True

# Training recipe
replay_ratio: 0.1
learning_starts: 5000
per_rank_pretrain_steps: 100
per_rank_sequence_length: ???


# Inputs: the images resized and scaled to [-0.5, 0.5] into the CNN of the world model, the vectors into its MLP.
# Outputs: the same keys reconstructed by the observation model, scored with a unit-variance Normal
inputs:
  image:
    keys: []
    transforms:
      - {_target_: sheeprl.transforms.Image, size: "${env.screen_size}", grayscale: "${env.grayscale}"}
      - {_target_: sheeprl.transforms.Scale, divisor: 255, shift: 0.5}
    net:
      _target_: sheeprl.algos.dreamer_v2.agent.CNNEncoder
      channels_multiplier: 32
      activation: ${algo.cnn_act}
  vector:
    keys: []
    transforms: []
    net:
      _target_: sheeprl.algos.dreamer_v2.agent.MLPEncoder
      mlp_layers: ${algo.mlp_layers}
      dense_units: ${algo.dense_units}
      activation: ${algo.dense_act}
outputs:
  image:
    keys: ${algo.inputs.image.keys}
    net:
      _target_: sheeprl.algos.dreamer_v2.agent.CNNDecoder
      channels_multiplier: ${algo.inputs.image.net.channels_multiplier}
      activation: ${algo.cnn_act}
    likelihood: {_target_: sheeprl.utils.distribution.UnitNormal, _partial_: true}
  vector:
    keys: ${algo.inputs.vector.keys}
    net:
      _target_: sheeprl.algos.dreamer_v2.agent.MLPDecoder
      mlp_layers: ${algo.mlp_layers}
      dense_units: ${algo.dense_units}
      activation: ${algo.dense_act}
    likelihood: {_target_: sheeprl.utils.distribution.UnitNormal, _partial_: true}

# Model related parameters
dense_units: 400
mlp_layers: 4
dense_act: torch.nn.ELU
cnn_act: torch.nn.ReLU

# World model
world_model:
  stochastic_size: 30
  kl_free_nats: 3.0
  kl_regularizer: 1.0
  min_std: 0.1
  use_continues: False
  # The scale of the continue loss (`pcont_scale` of the official implementation)
  continue_scale_factor: 10.0
  clip_gradients: 100.0

  # Recurrent model
  recurrent_model:
    recurrent_state_size: 200
    dense_units: ${algo.dense_units}
    dense_act: ${algo.dense_act}

  # Prior
  transition_model:
    hidden_size: 200
    dense_act: ${algo.dense_act}

  # Posterior
  representation_model:
    hidden_size: 200
    dense_act: ${algo.dense_act}

  # Reward model (2 hidden layers in the official implementation)
  reward_model:
    dense_act: ${algo.dense_act}
    mlp_layers: 2
    dense_units: ${algo.dense_units}

  # Discount model (3 hidden layers in the official implementation)
  discount_model:
    learnable: True
    dense_act: ${algo.dense_act}
    mlp_layers: 3
    dense_units: ${algo.dense_units}

  # World model optimizer (Adam with the default epsilon of TensorFlow, as in the official implementation)
  optimizer:
    lr: 6e-4
    eps: 1e-7
    weight_decay: 0

# Actor
actor:
  cls: sheeprl.algos.dreamer_v1.agent.Actor
  # The continuous actions come from a tanh-transformed normal (with `distribution.type=auto`), whose standard deviation
  # is `init_std` when the network outputs zero, at least `min_std`
  min_std: 1e-4
  init_std: 5.0
  dense_act: ${algo.dense_act}
  mlp_layers: ${algo.mlp_layers}
  dense_units: ${algo.dense_units}
  clip_gradients: 100.0
  expl_amount: 0.3
  expl_min: 0.0
  expl_decay: 0.0

  # Actor optimizer
  optimizer:
    lr: 8e-5
    eps: 1e-7
    weight_decay: 0

# Critic (3 hidden layers in the official implementation)
critic:
  dense_act: ${algo.dense_act}
  mlp_layers: 3
  dense_units: ${algo.dense_units}
  clip_gradients: 100.0

  # Critic optimizer
  optimizer:
    lr: 8e-5
    eps: 1e-7
    weight_decay: 0
