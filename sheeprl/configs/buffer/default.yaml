size: ???
memmap: True
validate_args: False
from_numpy: False
checkpoint: True  # Used only for off-policy algorithms
# Off-policy algorithms: the batches start with the steps added since the previous ones (in sequences of the sampled
# length), the oldest first, and only the rest of them is sampled uniformly from the buffer, so that every step is
# trained on soon after it is played (the online queue of DreamerV3)
online: False
# Off-policy algorithms: the batches are sampled in a thread while the training uses the previous ones, and moved to the
# device on a CUDA stream of their own; the first ones of every iteration during the training of the previous one, from
# the steps written until then (DreamerV3.5, which samples while it trains to write the latent states back, doesn't)
prefetch: False
# Off-policy algorithms with a replay buffer of steps (not of episodes): the buffer is kept in the memory of the device of
# the training, where its batches are gathered (no copy from the CPU, nothing to prefetch); `memmap` is then ignored. The
# buffer must fit in the free memory of the device when it is created
on_device: False
