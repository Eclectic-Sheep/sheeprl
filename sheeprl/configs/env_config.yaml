# @package _global_

# specify here default training configuration
defaults:
  - _self_
  - env: default.yaml

hydra:
  run:
    dir: logs/envs/${env.id}/${agent}

seed: 42
exp_name: "default"
root_dir: $env_logs
run_name: ${env.id}
agent: ???

algo:
  inputs:
    image:
      keys: []
      transforms:
        - {_target_: sheeprl.transforms.Image, size: "${env.screen_size}", grayscale: "${env.grayscale}"}
    vector:
      keys: []
      transforms: []
  extra_keys: []
