# @package _global_

defaults:
  - override /algo: muzero
  - override /env: gym
  - _self_

# Experiment
total_steps: 200000
learning_starts: 10000
update_epochs: 4
chunk_sequence_len: 10
chunks_per_batch: 64

# Buffer
buffer:
  size: 50000
  share_data: False
  max_trajectory_len: 1000
  memmap: False

algo:
  support_size: 300
  embedding_size: 64
  gamma: 0.99
  nstep_horizon: 10
  num_simulations: 50
  max_grad_norm: 1.0
  value_target_clip: 300.0

env:
  id: LunarLander-v2