# @package _global_

defaults:
  - dreamer_v2
  - override /env: atari
  - _self_

seed: 5

# Environment
# The Atari configuration of the official implementation (https://github.com/danijar/dreamerv2/blob/main/dreamerv2/configs.yaml):
# grayscale images, 200M frames (5e7 policy steps of 4 frames), 5e4 steps of random actions, batches of 16 sequences
env:
  max_episode_steps: 27000
  id: MsPacmanNoFrameskip-v0
  grayscale: True

# Checkpoint
checkpoint:
  every: 200000

# Buffer
buffer:
  size: 2000000
  type: episode
  checkpoint: True
  prioritize_ends: True

# Algorithm
algo:
  gamma: 0.999
  replay_ratio: 0.0625
  total_steps: 50000000
  learning_starts: 50000
  per_rank_batch_size: 16
  per_rank_pretrain_steps: 1
  
  world_model:
    use_continues: True
    kl_free_nats: 0.0
    kl_regularizer: 0.1
    discount_scale_factor: 5.0
    optimizer:
      lr: 0.0002
  actor:
    ent_coef: 0.001
    optimizer:
      lr: 4e-05
  critic:
    optimizer:
      lr: 0.0001
