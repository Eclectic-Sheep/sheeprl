# @package _global_

defaults:
  - sac
  - override /algo: sac_ae
  - override /model_manager: sac_ae
  - _self_

# Algorithm
algo:
  per_rank_batch_size: 128
  inputs:
    image:
      # The images stacked with the previous ones: the list replaces the one of the algorithm
      transforms:
        - {_target_: sheeprl.transforms.Image, size: "${env.screen_size}", grayscale: "${env.grayscale}"}
        - {_target_: sheeprl.transforms.FrameStack, n: 3}
        - {_target_: sheeprl.transforms.Scale, divisor: 255, shift: 0}

# Environmment
env:
  # The images of the official implementation (the size must be even)
  screen_size: 84

metric:
  aggregator:
    metrics:
      Loss/reconstruction_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
