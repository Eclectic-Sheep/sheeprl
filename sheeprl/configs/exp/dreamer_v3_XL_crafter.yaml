# @package _global_

defaults:
  - dreamer_v3
  - override /algo: dreamer_v3_XL
  - override /env: crafter
  - _self_

# Experiment
seed: 5

# Environment
env:
  num_envs: 1
  id: crafter_reward

# Checkpoint
checkpoint:
  every: 100000

# Buffer
buffer:
  checkpoint: True

# Algorithm
algo:
  total_steps: 1000000
  replay_ratio: 0.5
  inputs:
    image:
      keys: [rgb]
    vector:
      keys: [reward]
  outputs:
    image:
      keys: [rgb]
    vector:
      keys: []
