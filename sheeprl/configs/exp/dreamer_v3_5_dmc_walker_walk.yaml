# @package _global_

# DreamerV3 (Nature version) on the DeepMind Control Suite from pixels (Visual Control), as in the paper: 1M environment
# steps with an action repeat of 2, 16 environments, a replay ratio of 512 and the 12M model

defaults:
  - dreamer_v3_5
  - override /algo: dreamer_v3_5_12M
  - override /env: dmc
  - _self_

# Experiment
seed: 5

# Environment
env:
  num_envs: 16
  action_repeat: 2
  max_episode_steps: -1
  wrapper:
    domain_name: walker
    task_name: walk
    from_vectors: False
    from_pixels: True

# Checkpoint
checkpoint:
  every: 10000

# Buffer
buffer:
  # The whole run (the replay capacity of the paper is 5M)
  size: 500_000
  checkpoint: True
  memmap: True

# Algorithm
algo:
  # The policy steps: the 1M environment steps divided by the action repeat
  total_steps: 500_000
  cnn_keys:
    encoder:
      - rgb
  mlp_keys:
    encoder: []
  learning_starts: 1024
  # The replay ratio of 512 of the paper: 512 / (16 * 64) (the official configuration has 256)
  replay_ratio: 0.5

# Metric
metric:
  log_every: 5000
