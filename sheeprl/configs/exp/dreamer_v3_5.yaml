# @package _global_

# DreamerV3 (Nature version) on Atari, as in the paper: 200M environment steps (frames) with an action repeat of 4,
# 16 environments, a replay ratio of 32 and the 200M model

defaults:
  - override /algo: dreamer_v3_5
  - override /env: atari
  - override /model_manager: dreamer_v3_5
  - _self_

# Environment
env:
  num_envs: 16

# Algorithm
algo:
  # The policy steps: the 200M environment steps divided by the action repeat
  total_steps: 50_000_000
  per_rank_batch_size: 16
  per_rank_sequence_length: 64
  # The decoder reconstructs the observations of the encoder
  cnn_keys:
    encoder: [rgb]

# Checkpoint
checkpoint:
  every: 100000

# Buffer
buffer:
  # The replay capacity of the paper
  size: 5_000_000
  checkpoint: True
  # The batches start with the sequences of the new steps (the `replay.online` of the official configuration)
  online: True

metric:
  aggregator:
    metrics:
      Loss/world_model_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/value_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/policy_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/replay_value_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/observation_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/reward_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/state_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/continue_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      State/kl:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      State/post_entropy:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      State/prior_entropy:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Actor/entropy:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Values/return:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Values/value:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Grads/agent:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
