# @package _global_

defaults:
  - dreamer_v3
  - override /algo: dreamer_v3_L
  - override /env: diambra
  - _self_

# Experiment
seed: 0

# Environment
env:
  id: doapp
  num_envs: 4
  grayscale: True
  screen_size: 128
  reward_as_observation: True
  wrapper:
    diambra_settings:
      role: null
      characters: null
      difficulty: 4
    diambra_wrappers:
      no_attack_buttons_combinations: False

# Checkpoint
checkpoint:
  every: 100000

# Buffer
buffer:
  checkpoint: True

# Algorithm
algo:
  total_steps: 10000000
  per_rank_batch_size: 8
  learning_starts: 65536
  replay_ratio: 0.125
  inputs:
    image:
      keys: [frame]
    vector:
      keys: [own_character, own_health, own_side, own_wins, opp_character, opp_health, opp_side, opp_wins, stage, timer, action, reward]
  outputs:
    vector:
      keys: [own_character, own_health, own_side, own_wins, opp_character, opp_health, opp_side, opp_wins, stage, timer, action]

# Metric
metric:
  log_every: 10000
